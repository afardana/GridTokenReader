# /etc/nginx/conf.d/gridtoken-map.conf: map a device's bearer token to its id.
# Bearer tokens are ~71 chars; the default bucket (64) is too small.
map_hash_bucket_size 128;
map $http_authorization $gridtoken_device {
    default "";
    include /etc/nginx/gridtoken/tokens.map;   # "Bearer <token>" <device-id>;  (chmod 600)
}
