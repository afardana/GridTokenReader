# Paste inside the `server { listen 443 ssl; ... }` block that proxies Node-RED,
# above `location / { ... }`.
location ~ ^/gridtoken/(ingest|reading)$ {
        if ($gridtoken_device = "") {
                add_header WWW-Authenticate "Bearer" always;
                return 401;
        }
        client_max_body_size 2m;
        proxy_http_version 1.1;
        # Node-RED httpNodeAuth as a Basic header (or `proxy_set_header Authorization "";`
        # when Node-RED has no httpNodeAuth). Written by gridtoken-set-upstream-auth.
        include /etc/nginx/gridtoken/upstream-auth.conf;
        proxy_set_header X-Device-Id         $gridtoken_device;   # identity comes from the token
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_pass http://localhost:1880;
}
