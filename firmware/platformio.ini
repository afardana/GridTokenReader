; GridTokenReader firmware — ESP32-CAM (AI-Thinker) + OV2640 + 4 MB PSRAM
;
;   pio run                          build
;   pio run -t upload                flash over the ESP32-CAM-MB / USB-serial adapter
;   pio run -e esp32cam-ota -t upload  flash over Wi-Fi (OTA_HOST / OTA_PASSWORD from .env)
;   pio device monitor               serial console (115200)
;
; Credentials/endpoints come from ../.env (see ../.env.example) via scripts/load_env.py.

[platformio]
default_envs = esp32cam

[env]
; pioarduino = Arduino-ESP32 core 3.x on PlatformIO (the upstream espressif32
; platform is frozen on core 2.x). Pinned: Arduino core 3.3.12 / ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 230400      ; CH340 on the ESP32-CAM-MB corrupts at 460800+
lib_deps =
  knolleary/PubSubClient @ ^2.8
extra_scripts = pre:scripts/load_env.py

[env:esp32cam]
board = esp32cam
; Two ~1.9 MB OTA app slots (ota_0/ota_1) + small SPIFFS.
board_build.partitions = min_spiffs.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=3

; Same firmware, uploaded over Wi-Fi via ArduinoOTA (espota). The target comes
; from OTA_HOST in .env, or override: pio run -e esp32cam-ota -t upload --upload-port <ip>
[env:esp32cam-ota]
extends = env:esp32cam
upload_protocol = espota
